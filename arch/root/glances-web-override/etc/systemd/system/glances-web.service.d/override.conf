# Package-owned unit (extra/glances já instala glances-web.service) — nunca
# duplicar/renomear, só drop-in (regra em AGENTS.md).
#
# Web UI do Glances (porta padrão 61208) pra acompanhar a máquina pelo
# celular. Bind em 0.0.0.0 (LAN do escritório + Tailscale), sem senha —
# quem chega já passou pelo ufw, que só libera 192.168.5.0/24 e
# 100.64.0.0/10 nessa porta. Depende de uvicorn + python-fastapi (deps
# opcionais do glances, instaladas --asdeps).
#
# A unit do pacote lê GLANCES_ARGS de /etc/conf.d/glances via
# EnvironmentFile=, que tem precedência sobre Environment=. Por isso o
# EnvironmentFile= vazio abaixo zera a lista antes — sem tocar no arquivo do
# pacote nem no ExecStart=.
#
# Sem espera pelo Tailscale (diferente do sccache-server-notify): bind em
# 0.0.0.0 não depende do tailscale0 ter IP no boot.
[Unit]
OnFailure=notify-failure@%N.service

[Service]
EnvironmentFile=
Environment="GLANCES_ARGS=-B 0.0.0.0"
