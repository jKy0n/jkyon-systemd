# Builder (Gentoo): worker distcc só pra nós do Tailscale (AGENTS.md: nunca LAN).
# Não sobrescreve o ExecStart do pacote (--allow $ALLOWED_SERVERS): a variável
# sem chaves é dividida em palavras pelo systemd, então dá pra encadear mais
# --allow e opções extras por aqui.
# Viamar-PC (100.100.10.20) fora até migrar pro Gentoo (2026-10-26): o GCC do
# Arch é de outro snapshot (AGENTS.md: nunca nó distcc com GCC divergente).
[Service]
Environment="ALLOWED_SERVERS=127.0.0.1 --allow 100.100.10.10 --allow 100.100.10.30 --jobs 6 --log-level warning"
