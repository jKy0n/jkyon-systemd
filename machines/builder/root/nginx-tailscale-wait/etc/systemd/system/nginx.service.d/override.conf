# Package-owned unit (nginx do repositório oficial) — nunca duplicar/renomear,
# só drop-in (regra em AGENTS.md). Só no Builder: aqui o nginx termina TLS
# (cert Tailscale via `tailscale cert`) na frente do sccache-scheduler, escutando
# em 100.100.10.50:8443 (`/etc/nginx/conf.d/sccache-scheduler.conf`).
#
# `network-online.target` não garante que a interface tailscale0 já tenha IP
# atribuído — só que a rede "básica" está de pé. Confirmado em produção
# (2026-09-12): o Builder reiniciou, o bind falhou com "Cannot assign
# requested address" 5x em sequência antes do tailscaled terminar de subir, e
# o systemd desistiu via start-limit-hit — nginx (e o cluster sccache-dist
# inteiro, que depende dele pra alcançar o scheduler) ficou fora do ar por
# mais de 13h até intervenção manual. O ExecStartPre espera até 30s pelo IP
# de verdade antes de deixar o ExecStart= original tentar o bind. A mesma
# notificação de falha usada em todo o resto do parque também é adicionada
# aqui, já que essa unit não tinha nenhuma.
[Unit]
After=tailscaled.service
Wants=tailscaled.service
OnFailure=notify-failure@%N.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do tailscale ip -4 >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1'
