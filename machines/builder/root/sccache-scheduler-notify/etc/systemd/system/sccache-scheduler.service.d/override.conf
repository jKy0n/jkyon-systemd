# Package-owned unit (extra/sccache no Arch já instala sccache-scheduler.service
# com --features dist-server) — nunca duplicar/renomear, só drop-in (regra em
# AGENTS.md). Só no Builder — único nó que roda o scheduler (ver
# jkyon-ai-context/machines/sccache-dist.md). Só adiciona a mesma notificação
# de falha usada em todo o resto do parque, sem tocar no ExecStart= original.
[Unit]
OnFailure=notify-failure@%N.service
