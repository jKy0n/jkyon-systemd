# Decisão de 2026-09-18: reservar CPU fora do cluster sccache-dist em
# cada máquina, em vez de deixar o server anunciar todos os núcleos
# físicos pro scheduler. Builder reserva 10 dos 12 núcleos (self-hosting
# — esse server compila pro próprio cluster, além de rodar o scheduler).
#
# `CPUQuota=` (cgroup) é usado porque não existe opção nativa no
# server.conf do sccache-dist pra limitar CPU/jobs (conferido em
# /usr/share/doc/sccache/Distributed.md). O binário lê `num_cpus` via a
# crate `num_cpus`, que desde a v1.15+ respeita quota de cgroup, não só
# afinidade (confirmado via `strings` no binário: referencia
# `cpu.cfs_quota_us`, `cpu.cfs_period_us`, `cgroup.controllers`) — então
# limitar aqui é suficiente pra reduzir o `num_cpus` reportado no
# heartbeat pro scheduler. Drop-in separado do `override.conf` do
# pacote `sccache-server-notify` (que é `shared/`, valor igual nas 3
# máquinas) porque esse valor é por-máquina.
[Service]
CPUQuota=1000%
