# TheseusMachine (Gentoo): worker distcc só pra nós do Tailscale (AGENTS.md: nunca LAN).
# Não sobrescreve o ExecStart do pacote (--allow $ALLOWED_SERVERS): a variável
# sem chaves é dividida em palavras pelo systemd, então dá pra encadear mais
# --allow e opções extras por aqui. Mesmo modelo do Builder.
# A própria máquina (100.100.10.10) entra pelo 127.0.0.1.
# Viamar-PC (100.100.10.20) fora até migrar pro Gentoo (2026-10-26): o GCC do
# Arch é de outro snapshot (AGENTS.md: nunca nó distcc com GCC divergente).
# CrisNote (100.100.10.30) fora pelo mesmo motivo até migrar pro Gentoo (2026-10-24).
# --jobs = núcleos online - 2 (32 threads, 2 offline pela mitigação de MCE = 30).
[Service]
Environment="ALLOWED_SERVERS=127.0.0.1 --allow 100.100.10.50 --jobs 28 --log-level warning"
