# Package-owned unit (docker.service, instalado pelo pacote docker do Portage)
# — nunca duplicar/renomear, só drop-in (regra em AGENTS.md).
#
# `network-online.target` não garante que a interface tailscale0 já tenha IP
# atribuído — só que a rede "básica" está de pé. Confirmado em produção
# (Builder, 2026-09-12): um serviço que faz bind num IP do Tailscale (nginx,
# sccache-server) sofreu "Cannot assign requested address" 5x em sequência
# num boot frio, antes do tailscaled terminar de subir, até o systemd
# desistir via start-limit-hit. Mesmo padrão de fix já usado em
# shared/root/sccache-server-notify e machines/builder/root/nginx-tailscale-wait.
#
# Aqui o risco é o mesmo: a stack Loki+Grafana (~/docker-compose/loki-stack/)
# publica portas via `ports: ["100.100.10.10:PORTA:PORTA"]` — bind direto no
# IP Tailscale, não network_mode: host. Sem esse ExecStartPre, um reboot frio
# pode recriar os containers antes do IP existir e falhar o bind.
#
# Orçamento aumentado de 30s pra 60s em 2026-09-17: a Viamar-PC bateu no
# mesmo guard (pacote sccache-server-notify) e falhou por só 4s de margem —
# 30s não é folga suficiente nesse tipo de corrida.
[Unit]
OnFailure=notify-failure@%N.service
After=tailscaled.service
Wants=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do tailscale ip -4 >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1'
