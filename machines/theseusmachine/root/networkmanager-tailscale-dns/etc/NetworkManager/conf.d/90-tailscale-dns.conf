# Confirmado em produção (2026-09-18): o sccache-server.service da
# TheseusMachine estava `active`, mas não conseguia resolver
# `builder.tail2aecab.ts.net` (funcionava com --resolve pro IP direto —
# rede/TLS/auth OK, só DNS quebrado). Causa: /etc/resolv.conf era escrito
# pelo NetworkManager (dns=default, comportamento padrão — não existia
# NetworkManager.conf nenhum nessa máquina), sobrescrevendo o que o
# tailscaled queria escrever.
#
# journalctl -u tailscaled confirma que o tailscaled já TENTA cuidar do
# DNS sozinho (`dns: using "direct" mode`, querendo apontar
# /etc/resolv.conf pro resolver dele em 100.100.100.100, que resolve
# *.tail2aecab.ts.net via MagicDNS) — só perde a corrida porque a
# integração via D-Bus com o NetworkManager falha (`nm-resolved=no` no
# log) e o NetworkManager, em modo `dns=default`, também escreve o
# arquivo direto.
#
# Fix: `dns=none` faz o NetworkManager parar de mexer em
# /etc/resolv.conf, deixando o tailscaled ser o único dono — exatamente o
# que ele já tenta fazer. Não precisa da integração com systemd-resolved
# (que está `active` mas em `resolv.conf mode: foreign`, não fazendo nada
# útil hoje) só pra resolver isso.
[main]
dns=none
