# Package-owned unit (www-servers/nginx) — nunca duplicar/renomear, só drop-in
# (regra em AGENTS.md). Na TheseusMachine desde 2026-11-13: o nginx serve o
# binhost da incubadora em 100.100.10.10:8080 (/etc/nginx/conf.d/incubadora.conf),
# que antes ficava no Builder.
#
# Mesmo guard do pacote do Builder (machines/builder/root/nginx-tailscale-wait,
# histórico completo lá): network-online.target não garante IP na tailscale0, e
# o bind no IP do Tailscale falha com "Cannot assign requested address" até o
# tailscaled terminar de subir. Espera até 60s pelo IP antes do ExecStart=.
[Unit]
After=tailscaled.service
Wants=tailscaled.service
OnFailure=notify-failure@%N.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do tailscale ip -4 >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1'
