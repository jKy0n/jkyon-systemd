# Package-owned unit (sci-ml/ollama, /usr/lib/systemd/system/ollama.service) —
# nunca duplicar/renomear, só drop-in (regra em AGENTS.md). Até 2026-10-03 havia
# uma cópia completa em /etc/systemd/system/ollama.service sombreando a do pacote,
# com comentário na mesma linha dos limites (`CPUQuota=2800%  # ...`) — o systemd
# não aceita comentário inline, então CPUQuota e MemoryHigh eram descartados e o
# ollama rodava sem limite nenhum (CPUQuotaPerSecUSec=infinity). Comentário em
# systemd só em linha própria.
[Service]
# Roda como o próprio usuário (modelos em /mnt/VirtualMachines/LLM, dono jkyon),
# não como o usuário `ollama` do pacote. Group explícito pra não herdar o
# `Group=ollama` da unit do pacote.
User=jkyon
Group=jkyon
Nice=-10

# 28 das 30 threads online (cores 5/21 offline por MCE, ver mce.md).
CPUQuota=2800%
# ~87% dos 64 GB — acima disso o kernel força reclaim no cgroup (não mata).
MemoryHigh=56G

Environment="OLLAMA_KEEP_ALIVE=-1"
Environment="OLLAMA_HOST=0.0.0.0:11434"
Environment="OLLAMA_MAX_LOADED_MODELS=3"
Environment="OLLAMA_MODELS=/mnt/VirtualMachines/LLM/ollama-models"
