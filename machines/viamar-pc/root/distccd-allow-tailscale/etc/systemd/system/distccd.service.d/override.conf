# Viamar-PC (Gentoo desde 2026-10-26): worker distcc só pra nós do Tailscale (AGENTS.md: nunca LAN).
# Não sobrescreve o ExecStart do pacote (--allow $ALLOWED_SERVERS): a variável
# sem chaves é dividida em palavras pelo systemd, então dá pra encadear mais
# --allow e opções extras por aqui. Mesmo modelo do Builder e da TheseusMachine.
# CrisNote (100.100.10.30) fora até migrar pro Gentoo (GCC de outro snapshot).
# --jobs = núcleos online - 2 (12 - 2 = 10).
[Service]
Environment="ALLOWED_SERVERS=127.0.0.1 --allow 100.100.10.10 --allow 100.100.10.50 --jobs 10 --log-level warning"
