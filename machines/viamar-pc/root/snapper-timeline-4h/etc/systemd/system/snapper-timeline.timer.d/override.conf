# Snapshot do timeline de 4 em 4 horas (00, 04, 08, 12, 16, 20h), não de hora em hora.
# Vale pras 3 configs do snapper (root, home, VIAMAR_BACKUP): o timer é um só.
# Persistent=true: se a máquina estava desligada na hora marcada, tira um ao ligar.
[Timer]
OnCalendar=
OnCalendar=00/4:00
Persistent=true
