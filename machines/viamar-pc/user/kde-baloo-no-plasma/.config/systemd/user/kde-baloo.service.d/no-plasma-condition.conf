# Viamar-PC (niri, sem Plasma): o ExecCondition da unit do pacote chama o
# /usr/bin/kde-systemd-start-condition, que é do plasma-workspace e não existe
# aqui -> o systemd pula o baloo ("Skipped due to 'exec-condition'"). Zera a
# condição; o próprio baloo_file respeita o Indexing-Enabled do baloofilerc.
[Service]
ExecCondition=
