# Garante /etc/sccache-dist (dono root, 700 — guarda o token secreto do
# server.conf) antes do service subir, sem depender de mkdir manual.
# /var/cache/sccache-dist (toolchain cache, regenerável) não entra aqui —
# criado via CacheDirectory= na própria unit, convenção do repo (ver README).
d /etc/sccache-dist 0700 root root -
