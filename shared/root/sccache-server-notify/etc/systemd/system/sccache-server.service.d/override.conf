# Package-owned unit (dev-util/sccache no Gentoo, extra/sccache no Arch — os
# dois ebuilds/PKGBUILDs já instalam sccache-server.service com USE/feature
# dist-server) — nunca duplicar/renomear, só drop-in (regra em AGENTS.md).
#
# Notificação de falha (mesmo padrão usado em todo o resto do parque) +
# hardening de boot: server.conf usa `public_addr` num IP do Tailscale, e
# `network-online.target` (dependência padrão do systemd) não garante que a
# interface tailscale0 já tenha IP atribuído nesse ponto — só que a rede
# "básica" está de pé. Confirmado em produção (2026-09-12): Builder reiniciou,
# o bind falhou com "Cannot assign requested address" 5x em sequência antes
# do tailscaled terminar de subir, e o systemd desistiu via start-limit-hit —
# server ficou morto até intervenção manual. O ExecStartPre espera até 60s
# pelo IP de verdade antes de deixar o ExecStart= original tentar o bind.
# Orçamento aumentado de 30s pra 60s em 2026-09-17: um boot da Viamar-PC
# bateu no mesmo guard e falhou por só 4s de margem (tailscale0 recebeu IP
# 4s depois do ExecStartPre desistir) — 30s não é folga suficiente.
[Unit]
OnFailure=notify-failure@%N.service
After=tailscaled.service
Wants=tailscaled.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do tailscale ip -4 >/dev/null 2>&1 && exit 0; sleep 1; done; exit 1'
