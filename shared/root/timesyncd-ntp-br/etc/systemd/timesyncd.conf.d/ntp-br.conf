# NTP.br como fonte de hora (config oficial do guia: https://ntp.br/guia/linux/#systemd-timesyncd).
# Máquinas Gentoo do parque (TheseusMachine, Viamar-PC, Builder), desde 2026-11-24.
# O FallbackNTP= substitui o pool do Gentoo (0-3.gentoo.pool.ntp.org).
# Sem NTS: o timesyncd não suporta; o chrony com NTS não entra sem função clara.
[Time]
NTP=a.ntp.br b.ntp.br c.ntp.br
FallbackNTP=a.st1.ntp.br b.st1.ntp.br c.st1.ntp.br d.st1.ntp.br e.st1.ntp.br gps.nu.ntp.br gps.jd.ntp.br gps.ce.ntp.br
